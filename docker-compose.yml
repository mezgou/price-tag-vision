name: price-tag-vision

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}; do sleep 1; done;
      mc mb -p local/${S3_BUCKET} || true;
      exit 0;
      "

  backend:
    image: backend-local
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--project", "/app/backend", "--no-sync", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: worker-local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run --project /app/backend --no-sync python -m app.worker.run_worker
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      vision-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--project", "/app/backend", "--no-sync", "python", "-m", "app.worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  vision-service:
    image: vision-service-local
    container_name: vision-service
    build:
      context: .
      dockerfile: vision_service/Dockerfile
    env_file:
      - .env
    ports:
      - "9001:9001"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--project", "/app/vision_service", "--no-sync", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: frontend-local
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg_data:
  object_data:
