pipeline:
  name: price_tag_cpu_v1
  version: "0.1.0"

runtime:
  device: cpu
  debug: true

video:
  metadata_backend: opencv

frame_sampling:
  sample_fps: 1.0
  max_frames: 20
  orientation_mode: rotate_90_ccw
  debug_save_frames: true
  debug_jpeg_quality: 85

candidate_detection:
  enabled: true
  source: heuristic_color_geometry_v1
  max_candidates_per_frame: 50
  min_area_ratio: 0.00005
  max_area_ratio: 0.08
  min_aspect_ratio: 1.2
  max_aspect_ratio: 8.0
  nms_iou_threshold: 0.4
  debug_save_overlays: true
  debug_overlay_jpeg_quality: 85

crop_extraction:
  enabled: true
  source: crop_extraction_v1
  bbox_padding_ratio: 0.08
  min_crop_width: 24
  min_crop_height: 16
  max_crops_per_frame: 50
  max_total_crops: 300
  debug_save_crops: true
  debug_crop_jpeg_quality: 90
  top_crops_preview_limit: 20

barcode_qr_decode:
  enabled: true
  max_crops: 100
  min_crop_quality_score: 0.15
  decoders:
    opencv_qr_detector:
      enabled: true
    optional_zxingcpp:
      enabled: false
  variants:
    original: true
    grayscale: true
    clahe: true
    sharpened: true
    resized_x2: true
    adaptive_threshold: true
  stop_after_first_success_per_crop: false
  max_payload_preview_length: 300

artifacts:
  csv: result.csv
  preview: preview.json
  manifest: debug/pipeline_manifest.json

stages:
  - FrameMetadataStage
  - FrameSamplingStage
  - HeuristicCandidateDetectionStage
  - CropExtractionStage
  - BarcodeQrDecodeStage
  - CsvWriterStage
  - PreviewWriterStage
  - DebugManifestStage
