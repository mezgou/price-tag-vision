pipeline:
  name: price_tag_v5
  version: "0.1.0"

runtime:
  device: cpu
  debug: true

video:
  metadata_backend: opencv

# Process in undistorted + upright space; CSV bbox mapped back to raw.
camera:
  undistort: true

frame_sampling:
  sample_fps: 5.0
  max_frames: 600
  orientation_mode: none
  # Crop/frame image previews are intentionally OFF for the service: the
  # product surface is the CSV (+ its preview.json rows). Skipping image
  # dumps also removes a large chunk of per-frame I/O from a full run.
  debug_save_frames: false
  debug_jpeg_quality: 88

yolo_detection:
  enabled: true
  weights_path: runs/detect/train/weights/best.pt
  fallback_weights_path: runs/detect/train/weights/best.pt
  source: yolov8m_price_tag_runs_train
  confidence_threshold: 0.20
  iou_threshold: 0.50
  imgsz: 1280
  device: "0"
  max_detections_per_frame: 32

tracking:
  enabled: true
  source: bytetrack_v1
  iou_threshold: 0.18
  center_distance_ratio: 0.65
  max_time_gap_ms: 2500

crop_extraction:
  enabled: true
  source: crop_extraction_top_quality_v2
  bbox_padding_ratio: 0.12
  min_crop_width: 50
  min_crop_height: 50
  max_crops_per_frame: 32
  max_total_crops: 900
  debug_save_crops: false
  debug_crop_jpeg_quality: 92
  top_crops_preview_limit: 40
  debug_save_contact_sheet: false
  contact_sheet_top_n: 80
  contact_sheet_thumb_width: 180

top_k_crop_selection:
  enabled: true
  max_crops_per_track: 8
  max_total_crops: 900
  min_quality_score: 0.05

v5_spatial_slot_merge:
  enabled: true
  # Conservative tracklet de-fragmentation: only merge non-overlapping,
  # temporally adjacent tracklets with nearly identical raw-frame geometry.
  max_time_gap_ms: 1600
  min_edge_score: 0.72
  min_iou: 0.10
  max_center_distance_ratio: 0.55
  max_y_center_delta_ratio: 0.35
  min_size_ratio: 0.45
  allow_time_overlap: false
  absorb_untracked_overlaps: true
  overlap_absorb_min_iou: 0.55
  overlap_absorb_max_detections: 2

barcode_qr_decode:
  enabled: true
  max_crops: 360
  min_crop_quality_score: 0.05
  decoders:
    opencv_qr_detector:
      enabled: true
    optional_zxingcpp:
      enabled: true
    optional_pyzbar:
      enabled: true
    optional_aruco:
      enabled: false
  variants:
    original: true
    grayscale: true
    clahe: false
    sharpened: false
    resized_x2: true
    resized_x3: true
    resized_x4: false
    adaptive_threshold: true
    right_angle_rotations: false
    small_angle_rotations: false
  stop_after_first_success_per_crop: true
  max_payload_preview_length: 500

barcode_qr_zone_decode:
  enabled: true
  max_crops: 360
  min_crop_quality_score: 0.05
  stop_after_first_success_per_crop: true

v5_barcode_bars_decode:
  enabled: true
  max_crops: 360
  min_crop_quality_score: 0.05
  min_confidence: 0.74
  stop_after_first_success_per_track: true

v5_decoded_symbol_gate:
  enabled: true
  db_hack_path: data/db_hack.csv
  require_ean13_checksum: true
  require_catalog_code_for_match_key: true
  keep_rejected_symbols_artifact: true

# v5 identity engine: one fast full-crop PaddleOCR-en pass per crop,
# block-geometry price parse, per-slot brand-token pool -> CatalogResolver
# (db_hack.csv) -> exact product_name + safe barcode. No GT used.
v5_block_ocr:
  enabled: true
  max_crops: 900
  upscale: 3.0
  # "wine" bucket measured: accepted 4/12, name precision 100%, bc∈GT 3/4,
  # 129 ms/track. "all" was tried and REJECTED — it dropped name precision
  # to 80% (a wrong identity is worse than empty) and was 27x slower. Non-
  # wine videos (43_15 honey, 49_5) are a known, documented recall gap, not
  # worth a precision regression on the primary wine scenario.
  category: wine
  db_path: data/db_hack.csv
  # Current behavior: best_effort_name records catalog_guess_* metadata only;
  # product_name remains reserved for confirmed identity.
  best_effort_name: true

row_fusion:
  enabled: true
  include_undecoded_detections: true
  default_absent_value: нет

v5_row_confidence_gate:
  enabled: true
  # "balanced" is the final-CSV mode: suppress weak localized/color-only
  # rows and keep rows with a match key or enough independent evidence.
  # "recall" remains available for diagnostics and can still be enabled via
  # request config; suppressed candidates are recorded in row_confidence.json.
  # "strict" keeps any identity/text/price evidence without confidence
  # thresholding.
  mode: balanced
  keep_price_only_rows: true
  min_confidence: 0.30
  spatial_dedup_iou: 0.60

artifacts:
  csv: result.csv
  preview: preview.json
  manifest: debug/pipeline_manifest.json

stages:
  - FrameMetadataStage
  - FrameSamplingStage
  - YoloByteTrackStage
  - CropExtractionStage
  - TopKCropSelectionStage
  - V5SpatialSlotMergeStage
  - BarcodeQrDecodeStage
  - QrZoneDecodeStage
  - V5BarcodeBarsCropDecodeStage
  - V5DecodedSymbolGateStage
  - V5BlockOcrCatalogStage
  - RowFusionStage
  - V5RowConfidenceGateStage
  - CsvWriterStage
  - PreviewWriterStage
  - DebugManifestStage
