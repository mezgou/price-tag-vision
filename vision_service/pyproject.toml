[project]
name = "vision-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.7",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.1",
    "opencv-contrib-python-headless>=4.13.0.92",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pyzbar>=0.1.9",
    "pydantic-settings>=2.14.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.28",
    "rapidfuzz>=3.14.5",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.51",
    "uvicorn>=0.46.0",
    "zxing-cpp>=3.0.0",
    "paddleocr>=2.10.0",
    "paddlepaddle==3.0.0",
    "rapidocr-onnxruntime>=1.4.4",
    "scipy>=1.17.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
